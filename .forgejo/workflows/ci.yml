name: "CI/CD & Canonical Release to Banca"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: "Checks, Tests & Quality Gates"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configure Canonical Gambi Cargo Registry"
        env:
          TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN || secrets.REGISTRY_TOKEN || secrets.LUMEN_REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          printf '[registries.lumen]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' >> "$HOME/.cargo/config.toml"
          if [ -n "$TOKEN" ]; then
            RAW_TOKEN="${TOKEN#Bearer }"
            printf '[registries.gambi]\ntoken = "Bearer %s"\n[registries.lumen]\ntoken = "Bearer %s"\n' "$RAW_TOKEN" "$RAW_TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Format Check"
        run: cargo fmt --check

      - name: "Clippy Check (Zero Warnings)"
        run: cargo clippy --all-targets -- -D warnings

      - name: "Run Unit & Integration Tests"
        run: cargo test --workspace

      - name: "Audit CI Permissions & Decoupling"
        run: |
          bash tests/test-ci-permissions.sh
          bash tests/test_ci_decouple_jobs.sh

      - name: "CCCP Quality Audit"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict || true
          fi

  deploy-web:
    name: "Build WebAssembly & Publish to Generic Packages"
    runs-on: ubuntu-latest
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Compile WebAssembly Bundle & Publish to Generic Packages"
        env:
          GAMBI_2LP_IN_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.FORGEJO_TOKEN || secrets.GIT_2LP_TOKEN }}
        run: |
          echo "★ Compilando Navalha Web (WASM)..."
          mkdir -p site/pkg
          cd crates/navalha-web
          wasm-pack build --target web --out-dir ../../site/pkg
          cp -r assets ../../site/ || true
          cd ../..
          cccp package upload site

  deploy-banca:
    name: "Build & Publish Navalha Multiarch to Banca"
    runs-on: ubuntu-latest
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    container:
      image: gambi.2lp.in/lumen/gost-ci-cross:latest
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Determine Release Channel and Version"
        id: meta
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            CHANNEL="stable"
            VERSION="${REF#refs/tags/v}"
          else
            CHANNEL="nightly"
            BASE_VER=$(head -n 1 VERSION 2>/dev/null | cut -d'+' -f1 | tr -d ' \r\n' || echo "0.1.0-dev")
            GIT_SHA=$(git rev-parse --short HEAD)
            DATE_STAMP=$(date +%Y%m%d)
            VERSION="${BASE_VER}+${DATE_STAMP}.${GIT_SHA}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "★ Canal: $CHANNEL | Versão: $VERSION"

      - name: "Configure Canonical Gambi Cargo Registry"
        env:
          TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN || secrets.GIT_2LP_TOKEN || secrets.REGISTRY_TOKEN || secrets.LUMEN_REGISTRY_TOKEN || secrets.FORGEJO_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          printf '[registries.lumen]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' >> "$HOME/.cargo/config.toml"
          if [ -n "$TOKEN" ]; then
            RAW_TOKEN="${TOKEN#Bearer }"
            printf '[registries.gambi]\ntoken = "Bearer %s"\n[registries.lumen]\ntoken = "Bearer %s"\n' "$RAW_TOKEN" "$RAW_TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Compile Navalha Multiarch CLI Binaries"
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          echo "★ [1/3] Compilando x86_64-unknown-linux-musl (Linux AMD64)..."
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p navalha-cli || \
            cargo build --release --target x86_64-unknown-linux-musl -p navalha-cli

          echo "★ [2/3] Compilando aarch64-unknown-linux-musl (Linux ARM64)..."
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p navalha-cli || \
            cargo build --release --target aarch64-unknown-linux-musl -p navalha-cli

          echo "★ [3/3] Compilando x86_64-pc-windows-gnu (Windows AMD64)..."
          cargo zigbuild --release --target x86_64-pc-windows-gnu -p navalha-cli || \
            cargo build --release --target x86_64-pc-windows-gnu -p navalha-cli

      - name: "Package Artifacts & Generate Checksums"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/packages

          # 1. Empacotar Linux AMD64
          if [ -d target/x86_64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/navalha-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release navalha \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/navalha-${VERSION}-linux-amd64.tar.gz" \
              -C target/x86_64-unknown-linux-musl/release navalha
          fi

          # 2. Empacotar Linux ARM64
          if [ -d target/aarch64-unknown-linux-musl/release ]; then
            tar -czf "dist/packages/navalha-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release navalha \
              -C "$PWD" README.md LICENSE 2>/dev/null || \
            tar -czf "dist/packages/navalha-${VERSION}-linux-arm64.tar.gz" \
              -C target/aarch64-unknown-linux-musl/release navalha
          fi

          # 3. Empacotar Windows AMD64
          if [ -d target/x86_64-pc-windows-gnu/release ]; then
            cd target/x86_64-pc-windows-gnu/release
            zip -j "$GITHUB_WORKSPACE/dist/packages/navalha-${VERSION}-windows-amd64.zip" \
              navalha.exe "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" 2>/dev/null || \
            zip -j "$GITHUB_WORKSPACE/dist/packages/navalha-${VERSION}-windows-amd64.zip" \
              navalha.exe
            cd "$GITHUB_WORKSPACE"
          fi

          cd dist/packages
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd "$GITHUB_WORKSPACE"

      - name: "Publish Artifacts to Forgejo Generic Packages"
        env:
          GAMBI_2LP_IN_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.FORGEJO_TOKEN || secrets.GIT_2LP_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          for PKG in dist/packages/*; do
            [ -f "$PKG" ] || continue
            cccp package upload "$PKG" --version "$VERSION"
          done
