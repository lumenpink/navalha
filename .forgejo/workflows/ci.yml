name: "CI / CD Pipeline"

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: "Validar Workspace, CLI & Wasm"
    runs-on: ubuntu-latest
    container:
      image: codeberg.org/lumenpink/gost-ci-wasm:latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cargo Check Workspace"
        run: cargo check --workspace

      - name: "Run Workspace Unit Tests"
        run: cargo test --workspace

      - name: "Compile Native CLI (navalha)"
        run: |
          cargo build --release -p navalha-cli
          mkdir -p dist/bin
          cp target/release/navalha dist/bin/navalha-linux-x86_64
          chmod +x dist/bin/navalha-linux-x86_64

      - name: "Build WebAssembly Bundle (navalha-web)"
        run: |
          mkdir -p dist/web site/pkg
          cd crates/navalha-web
          wasm-pack build --target web --out-dir ../../site/pkg
          cp -r ../../site/pkg ../../dist/web/
          cp -r assets ../../dist/web/ || true
          cp -r assets ../../site/ || true
          cp index.html ../../dist/web/

      - name: "Verify Build Artifacts"
        run: |
          test -f dist/bin/navalha-linux-x86_64 || { echo "CLI binary missing"; exit 1; }
          test -f site/pkg/navalha_web_bg.wasm || { echo "Wasm binary missing"; exit 1; }
          echo "Todos os testes e artefatos validados com sucesso."

  deploy:
    name: "Deploy Cloudflare Workers & Codeberg Pages"
    runs-on: ubuntu-latest
    container:
      image: codeberg.org/lumenpink/gost-ci-wasm:latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Compile WebAssembly for Production"
        run: |
          mkdir -p site/pkg
          cd crates/navalha-web
          wasm-pack build --target web --out-dir ../../site/pkg
          cp -r assets ../../site/ || true

      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Publicando WebApp e documentação em navalha.2lp.in via Cloudflare Workers..."
            wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN não configurado, pulando deploy no Cloudflare."
          fi

      - name: "Deploy to Codeberg Pages (Fallback)"
        uses: https://codeberg.org/actions/pages@v1
        with:
          path: site
